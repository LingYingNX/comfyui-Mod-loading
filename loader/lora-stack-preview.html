<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoRA 提示词堆栈 · 开发预览</title>
  <link rel="stylesheet" href="./loraStack.css">
  <style>
    :root { color-scheme: dark; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 32px;
      color: #f3f4f6;
      background:
        radial-gradient(circle at 20% 10%, rgba(43, 127, 255, 0.12), transparent 30%),
        #101012;
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .preview-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(400px, 500px) minmax(260px, 1fr);
      gap: 18px;
      align-items: start;
    }
    .node-frame {
      min-width: 0;
      padding: 10px;
      background: #171719;
      border: 1px solid #303036;
      border-radius: 10px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.4);
    }
    .node-title {
      height: 28px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      color: #d1d5db;
      font-size: 12px;
      font-weight: 700;
    }
    #surface {
      width: 410px;
      max-width: 100%;
      height: 520px;
    }
    .probe {
      position: sticky;
      top: 32px;
      min-width: 0;
      padding: 14px;
      background: #18181b;
      border: 1px solid #2e2f33;
      border-radius: 8px;
    }
    .probe h1 {
      margin: 0 0 6px;
      font-size: 14px;
    }
    .probe p {
      margin: 0 0 12px;
      color: #9ca3af;
      font-size: 11px;
      line-height: 1.6;
    }
    .probe pre {
      margin: 0;
      padding: 10px;
      color: #bfdbfe;
      background: #111113;
      border: 1px solid #2e2f33;
      border-radius: 6px;
      font: 11px/1.6 "Cascadia Mono", Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .probe-actions {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .probe-actions button {
      padding: 5px 8px;
      color: #d1d5db;
      background: #242428;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 10px;
    }
    .probe-actions button:hover {
      color: #60a5fa;
      background: rgba(43, 127, 255, 0.18);
    }
    @media (max-width: 900px) {
      body { padding: 16px; }
      .preview-shell { grid-template-columns: 1fr; }
      .probe { position: static; }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <section class="node-frame">
      <div class="node-title">LoRA 提示词堆栈（Studio）</div>
      <div id="surface"></div>
    </section>
    <aside class="probe">
      <h1>输出预览</h1>
      <p>开发预览仅使用内存数据，不会写入工作流。真实节点由 <code>loraStack.js</code> 挂到 ComfyUI 画布。</p>
      <pre id="output"></pre>
      <div class="probe-actions">
        <button id="drag-probe" type="button">模拟拖拽首槽到末尾</button>
      </div>
    </aside>
  </main>

  <script type="module">
    import {
      LoraStackView,
      composePromptPreview,
    } from "./loraStackWidget.js";

    const loraNames = [
      "characters/银发少女_v2.safetensors",
      "clothing/暗纹旗袍.safetensors",
      "style/胶片柔光.safetensors",
      "concept/月下庭院.safetensors",
    ];

    const promptSets = {
      "characters/银发少女_v2.safetensors": [
        {
          id: "author-silver-a",
          title: "银发蓝眼 · 白裙",
          source: "author",
          tokens: [
            "masterpiece",
            "best quality",
            "1girl",
            "silver hair",
            "blue eyes",
            "white dress",
            "high heels",
            "outdoors",
            "sunset",
            "detailed background",
          ],
        },
        {
          id: "author-silver-b",
          title: "银发蓝眼 · 夜景",
          source: "author",
          tokens: [
            "masterpiece",
            "1girl",
            "silver hair",
            "blue eyes",
            "black dress",
            "moonlight",
            "courtyard",
            "cinematic lighting",
          ],
        },
        {
          id: "custom-silver-c",
          title: "我的常用构图",
          source: "custom",
          tokens: [
            "upper body",
            "looking at viewer",
            "soft smile",
            "depth of field",
          ],
        },
      ],
      "clothing/暗纹旗袍.safetensors": [
        {
          id: "author-qipao",
          title: "暗纹旗袍 · 庭院",
          source: "author",
          tokens: [
            "dark qipao",
            "gold embroidery",
            "fitted dress",
            "red lantern",
            "wooden corridor",
          ],
        },
      ],
    };

    const initialState = {
      version: 1,
      slots: [
        {
          id: "preview-slot-1",
          lora: "characters/银发少女_v2.safetensors",
          strength: 0.85,
          set: "author-silver-a",
          disabled: { "author-silver-a": ["high heels"] },
          custom: "white ribbon\nsoft rim light",
        },
        {
          id: "preview-slot-2",
          lora: "clothing/暗纹旗袍.safetensors",
          strength: 0.7,
          set: "author-qipao",
          disabled: {},
          custom: "hand on hip",
        },
      ],
    };

    const cache = new Map(Object.entries(promptSets));
    const output = document.getElementById("output");
    const view = new LoraStackView(document.getElementById("surface"), {
      initialState,
      fetchPromptSets: async (lora) => cache.get(lora) || [],
      onStateChange: (state) => {
        output.textContent = composePromptPreview(state, cache) || "（空提示词）";
      },
      onEditStart: () => {},
      onEditEnd: () => {},
      onLayout: () => {},
    });
    view.setLoraNames(loraNames);
    output.textContent = composePromptPreview(view.getState(), cache);

    document.getElementById("drag-probe").addEventListener("click", () => {
      const cards = [...document.querySelectorAll(".ls-slot")];
      const handle = cards[0]?.querySelector(".ls-drag");
      if (!handle || cards.length < 2) return;
      const start = handle.getBoundingClientRect();
      const end = cards[cards.length - 1].getBoundingClientRect();
      const pointerId = 991;
      handle.dispatchEvent(
        new PointerEvent("pointerdown", {
          bubbles: true,
          button: 0,
          pointerId,
          clientY: start.top + start.height / 2,
        })
      );
      window.dispatchEvent(
        new PointerEvent("pointermove", {
          bubbles: true,
          pointerId,
          clientY: end.bottom + 2,
        })
      );
      window.dispatchEvent(
        new PointerEvent("pointerup", {
          bubbles: true,
          button: 0,
          pointerId,
          clientY: end.bottom + 2,
        })
      );
    });
  </script>
</body>
</html>
